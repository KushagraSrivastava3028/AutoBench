[project]
name = "autobench"
version = "1.0.0"
description = "A containerised, parallel evaluation platform for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kushagra" }]
keywords = ["evaluation", "agents", "llm", "benchmark", "sandbox"]

dependencies = [
    # --- control plane ---------------------------------------------------
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    # --- state layer -----------------------------------------------------
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "redis>=5.1.0",
    "arq>=0.26.0",
    "boto3>=1.35.0",
    # --- execution plane -------------------------------------------------
    "aiodocker>=0.23.0",
    "httpx>=0.27.2",
    "tomli-w>=1.0.0",
    # --- scoring ---------------------------------------------------------
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    # --- cli -------------------------------------------------------------
    "typer>=0.12.5",
    "rich>=13.9.0",
    # --- security --------------------------------------------------------
    "argon2-cffi>=23.1.0",
    "google-auth[requests]>=2.36.0",
    "psycopg2-binary>=2.9.10",
    # --- observability ---------------------------------------------------
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "google-genai>=0.3.0",
]
export = [
    "pyarrow>=17.0.0",
]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "testcontainers>=4.8.2",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "types-redis",
    "locust>=2.32.0",
]

[project.scripts]
autobench = "autobench.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autobench"]

# ---------------------------------------------------------------------------
# tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "C4",              # comprehensions
    "SIM",             # simplify
    "ASYNC",           # async correctness
    "S",               # bandit
    "RUF",
]
ignore = [
    "S101",   # assert in tests is fine
    "S603",   # subprocess call - we audit these individually
    "S607",   # partial executable path - docker/bash are on PATH by contract
    "B008",   # FastAPI Depends() in defaults
    "UP042",  # (str, Enum) kept: values must compare equal to raw DB strings
    "N818",   # AgentTimeout reads better than AgentTimeoutError at raise sites
    "ASYNC109", # `timeout=` is the Sandbox.exec contract, not an anti-pattern
    "ASYNC240", # single stat() calls on local paths; not worth a thread hop
    "S105",   # redaction regexes and placeholders, not credentials
    "RUF001", "RUF002", "RUF003",  # typographic dashes/arrows in prose are intended
    "SIM105", "SIM102", "RUF012", "C416",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N806"]
"src/autobench/db/migrations/**" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["src/autobench/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["aiodocker.*", "arq.*", "boto3.*", "botocore.*", "scipy.*", "testcontainers.*", "opentelemetry", "opentelemetry.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real Docker daemon and/or Postgres",
    "e2e: full stack",
    "slow: >10s",
    "statistical: Monte-Carlo, seeded",
]

[tool.coverage.run]
source = ["src/autobench"]
branch = true
