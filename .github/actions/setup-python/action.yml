name: Set up AutoBench Python
description: Install Python dependencies in an explicit project virtual environment

inputs:
  extras:
    description: Comma-separated project extras to install
    default: dev
    required: false

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v4
      with:
        version: "0.13.7"
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Create Python 3.12 environment
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        uv venv --python 3.12 "$GITHUB_WORKSPACE/.venv"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Install project dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PROJECT_EXTRAS: ${{ inputs.extras }}
      run: |
        requirement="."
        if [ -n "$PROJECT_EXTRAS" ]; then
          requirement=".[$PROJECT_EXTRAS]"
        fi
        uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" -e "$requirement"
